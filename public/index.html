<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Items | Inventory Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Top Navigation Header -->
    <header class="app-header">
      <div class="header-container">
        <div class="brand">
          <div class="brand-badge">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-title">Inventory Hub</span>
            <span class="brand-sub">Catalog Manager</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="main-container">
      <div class="page-intro">
        <h1 class="page-heading">Item Management</h1>
        <p class="page-desc">Create, inspect, update, and manage inventory items in real time.</p>
      </div>

      <div class="content-grid">
        <!-- Form Section -->
        <section class="card form-card">
          <div class="card-header">
            <div class="card-title-group">
              <h2 class="card-title">Item Details</h2>
              <p class="card-subtitle">Add a new item or modify an existing entry</p>
            </div>
          </div>

          <form id="form">
            <div class="form-group">
              <label for="nm" class="field-label">Name</label>
              <div class="input-wrapper">
                <input id="nm" type="text" placeholder="e.g. Wireless Keyboard" required autocomplete="off">
              </div>
            </div>

            <div class="form-group">
              <label for="pr" class="field-label">Price</label>
              <div class="input-wrapper price-wrapper">
                <span class="currency-symbol">$</span>
                <input id="pr" type="number" step="any" min="0" placeholder="0.00" required>
              </div>
            </div>

            <button type="submit" class="submit-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
              </svg>
              <span>Submit</span>
            </button>
          </form>
        </section>

        <!-- Table Section -->
        <section class="card table-card">
          <div class="card-header table-header">
            <div class="card-title-group">
              <h2 class="card-title">Catalog Items</h2>
              <p class="card-subtitle">Live records in the inventory registry</p>
            </div>
          </div>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th class="col-id">ID</th>
                  <th class="col-name">Name</th>
                  <th class="col-price">Price</th>
                  <th class="col-action">Action</th>
                </tr>
              </thead>
              <tbody id="list"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <!-- Required Text at Bottom-Right -->
    <div class="signature-tag" aria-hidden="true">ARYA NANDAN</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
